<!doctype html>
<!-- style: fondo crema inmediato, evita un destello blanco antes de que cargue el CSS -->
<html lang="es" style="background-color:#F5EDE3">


<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#F5EDE3" />
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#F5EDE3" />
  <!-- Para Safari en iOS -->
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <!-- SEO Básico -->
  <meta name="google-site-verification" content="tpMY44PFlp37gM-OMVTU3--NCcZT6kxZsihDYsqYqX4" />
  <title>Pastelia Bakery | Pastelería Artesanal</title>
  <meta name="description"
    content="En Pastelia Bakery ofrecemos tortas, queques y postres artesanales elaborados con dedicación e ingredientes de calidad. Realiza tu pedido por WhatsApp." />
  <meta name="keywords"
    content="Pastelería artesanal, torta de chocolate, queques, postres a pedido, Pastelia Bakery, delivery de postres, tortas Lima" />
  <meta name="author" content="Pastelia Bakery" />
  <link rel="canonical" href="https://pasteliabakery.vercel.app/" />

  <!-- Schema.org for SEO -->
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Bakery",
      "name": "Pastelia Bakery",
      "alternateName": "Pastelia",
      "image": "https://pasteliabakery.vercel.app/images/torta-de-chocolate.webp",
      "description": "En Pastelia Bakery ofrecemos tortas, queques y postres artesanales elaborados con dedicación e ingredientes de calidad.",
      "url": "https://pasteliabakery.vercel.app/",
      "logo": "https://pasteliabakery.vercel.app/images/logo-skeleton.webp",
      "telephone": "+51906650350",
      "priceRange": "S/ 8 - S/ 75",
      "address": {
        "@type": "PostalAddress",
        "addressLocality": "Lima",
        "addressCountry": "PE"
      },
      "areaServed": {
        "@type": "City",
        "name": "Lima"
      },
      "openingHoursSpecification": [
        {
          "@type": "OpeningHoursSpecification",
          "dayOfWeek": ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday"],
          "opens": "10:00",
          "closes": "19:00"
        },
        {
          "@type": "OpeningHoursSpecification",
          "dayOfWeek": "Saturday",
          "opens": "13:00",
          "closes": "19:00"
        }
      ],
      "sameAs": [
        "https://www.instagram.com/pastelia___bakery",
        "https://www.tiktok.com/@pastelia__bakery"
      ]
    }
    </script>

  <!-- Open Graph (Facebook / WhatsApp / LinkedIn) -->
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://pasteliabakery.vercel.app/" />
  <meta property="og:title" content="Pastelia Bakery | Postres artesanales" />
  <meta property="og:description"
    content="Tortas, queques y dulces elaborados con dedicación, ingredientes de calidad y atención al detalle." />
  <meta property="og:image" content="https://pasteliabakery.vercel.app/og-image.jpg" />
  <meta property="og:image:type" content="image/jpeg" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="Torta de chocolate artesanal de Pastelia Bakery" />
  <meta property="og:site_name" content="Pastelia Bakery" />
  <meta property="og:locale" content="es_PE" />

  <!-- Twitter Cards -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Pastelia Bakery | Postres artesanales" />
  <meta name="twitter:description"
    content="Tortas, queques y dulces elaborados con dedicación, ingredientes de calidad y atención al detalle." />
  <meta name="twitter:image" content="https://pasteliabakery.vercel.app/og-image.jpg" />
  <meta name="twitter:image:alt" content="Torta de chocolate artesanal de Pastelia Bakery" />
  <!-- Favicons -->
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
  <!-- Precarga del logo del preloader y de la imagen principal (LCP) -->
  <link rel="preload" as="image" href="/images/logo-skeleton.webp" fetchpriority="high">
  <!-- Primera foto del Hero: copia liviana en pantallas normales, original en pantallas muy grandes (misma regla que src/data/hero.js) -->
  <link rel="preload" as="image" href="/images/thumbs/carrot-cake-800.webp" media="(max-resolution: 1.1dppx) and (max-width: 1700px)">
  <link rel="preload" as="image" href="/images/carrot-cake.webp" media="not all and (max-resolution: 1.1dppx) and (max-width: 1700px)">
  <!-- Las fuentes (Playfair Display y Plus Jakarta Sans) se sirven desde el propio sitio (@fontsource) -->

  <!-- CSS mínimo del splash (public/splash.css): se ve bien desde el primer instante, antes de la hoja principal -->
  <link rel="stylesheet" href="/splash.css">
</head>

<body>
  <div id="root"></div>
  <!-- Splash estático: el logo del preloader (elemento LCP) está en el HTML inicial para que el
       navegador lo descubra de inmediato. PageSkeleton.jsx lo reemplaza sin salto visual y lo elimina.
       Las medidas viven en las clases .splash-* de src/styles/index.css (compartidas con PageSkeleton). -->
  <div id="splash" class="fixed inset-0 z-[100] flex flex-col items-center justify-center overflow-hidden bg-pastelia-cream">
    <div class="relative flex flex-col items-center">
      <img
        src="/images/logo-skeleton.webp"
        alt="Cargando Pastelia..."
        width="144"
        height="144"
        fetchpriority="high"
        decoding="sync"
        class="splash-logo"
      />
      <div class="splash-bar"></div>
      <span class="splash-text invisible">Horneando...</span>
    </div>
  </div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
